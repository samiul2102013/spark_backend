resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name api.sparkcentra.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.sparkcentra.com;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/api.sparkcentra.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sparkcentra.com-0001/privkey.pem;

    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /media/;
        expires 7d;
    }

    location / {
        set $backend "http://django:8000";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
