openapi: 3.0.3
info:
  title: SPARK API
  version: 1.0.0
  description: Disaster communication and energy resilience platform
paths:
  /api/v1/admin/change-password/:
    put:
      operationId: admin_change_password_update
      description: Change password by providing old password, new password, and confirmation.
      summary: Change admin password
      tags:
      - admin
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
            examples:
              ChangePasswordExample:
                value:
                  old_password: currentPass123
                  new_password: newSecurePass456
                  confirm_password: newSecurePass456
                summary: Change Password Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/content/privacy-policy/:
    get:
      operationId: admin_content_privacy_policy_retrieve
      description: Retrieve the privacy policy content (admin).
      summary: Get privacy policy
      tags:
      - admin
      - Content
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticContent'
          description: ''
    patch:
      operationId: admin_content_privacy_policy_partial_update
      description: Update the privacy policy content (admin only).
      summary: Update privacy policy
      tags:
      - admin
      - Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaticContent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStaticContent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaticContent'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticContent'
          description: ''
  /api/v1/admin/content/terms/:
    get:
      operationId: admin_content_terms_retrieve
      description: Retrieve the terms and conditions content (admin).
      summary: Get terms and conditions
      tags:
      - admin
      - Content
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticContent'
          description: ''
    patch:
      operationId: admin_content_terms_partial_update
      description: Update the terms and conditions content (admin only).
      summary: Update terms and conditions
      tags:
      - admin
      - Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaticContent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStaticContent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaticContent'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticContent'
          description: ''
  /api/v1/admin/coordinators/:
    get:
      operationId: admin_coordinators_list
      description: Retrieve paginated list of all coordinators.
      summary: List coordinators
      parameters:
      - in: query
        name: hub_id
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - admin
      - Coordinators
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoordinatorList'
          description: ''
  /api/v1/admin/coordinators/{user_id}/:
    get:
      operationId: admin_coordinators_retrieve
      description: Full details of a specific coordinator.
      summary: Get coordinator details
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - admin
      - Coordinators
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinatorDetail'
          description: ''
  /api/v1/admin/coordinators/{user_id}/suspend/:
    patch:
      operationId: admin_coordinators_suspend_partial_update
      description: Deactivate a coordinator account.
      summary: Suspend coordinator
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - admin
      - Coordinators
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinatorList'
          description: ''
  /api/v1/admin/hubs/:
    get:
      operationId: admin_hubs_list
      description: Retrieve paginated list of all hubs.
      summary: List hubs
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - closed
          - critical
          - low_battery
          - open
      tags:
      - admin
      - Hubs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminHubList'
          description: ''
  /api/v1/admin/hubs/{hub_id}/:
    get:
      operationId: admin_hubs_retrieve
      description: Full hub detail with coordinator info, battery, starlink, last
        resident check-in, recent check-ins and hazards.
      summary: Get hub details
      parameters:
      - in: path
        name: hub_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      - Hubs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHubDetail'
          description: ''
    patch:
      operationId: admin_hubs_partial_update
      description: Update any field on a hub. Admin only.
      summary: Update hub
      parameters:
      - in: path
        name: hub_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      - Hubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminHubDetail'
            examples:
              UpdateHubExample:
                value:
                  name: Kingston Central Hub
                  address: 123 Main Street, Kingston
                  status: open
                  battery_percentage: 85
                  starlink_status: operational
                summary: Update Hub Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminHubDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminHubDetail'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHubDetail'
          description: ''
  /api/v1/admin/hubs/{hub_id}/assign-coordinator/:
    patch:
      operationId: admin_hubs_assign_coordinator_partial_update
      description: Assign a coordinator to a hub by their phone number.
      summary: Assign coordinator to hub
      parameters:
      - in: path
        name: hub_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      - Hubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssignCoordinator'
            examples:
              AssignCoordinatorExample:
                value:
                  coordinator_id: 01856669533
                summary: Assign Coordinator Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssignCoordinator'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssignCoordinator'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHubList'
          description: ''
  /api/v1/admin/hubs/{hub_id}/reassign-coordinator/:
    patch:
      operationId: admin_hubs_reassign_coordinator_partial_update
      description: Replace the coordinator for a hub.
      summary: Reassign coordinator
      parameters:
      - in: path
        name: hub_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      - Hubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReassignCoordinator'
            examples:
              ReassignCoordinatorExample:
                value:
                  new_coordinator_id: 01856669534
                summary: Reassign Coordinator Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReassignCoordinator'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReassignCoordinator'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHubList'
          description: ''
  /api/v1/admin/hubs/create/:
    post:
      operationId: admin_hubs_create_create
      description: Create a new hub with location and optional coordinator.
      summary: Create hub
      tags:
      - admin
      - Hubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubCreate'
            examples:
              CreateHubExample:
                value:
                  name: Port Antonio Hub
                  address: 10 Harbour Street
                  latitude: 18.1757
                  longitude: -76.4503
                  max_concurrent_bookings: 10
                  coordinator_id: 01856669533
                summary: Create Hub Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HubCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HubCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHubList'
          description: ''
  /api/v1/admin/overview/:
    get:
      operationId: admin_overview_retrieve
      description: 'Aggregated platform statistics for the admin dashboard: check-ins,
        hubs, hazards, users, messages, urgent flags, and check-ins over time.'
      summary: Get admin overview
      tags:
      - admin
      - Overview
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
          description: ''
  /api/v1/admin/profile/:
    get:
      operationId: admin_profile_retrieve
      description: Retrieve the admin's own profile information.
      summary: Get admin profile
      tags:
      - admin
      - Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
    patch:
      operationId: admin_profile_partial_update
      description: Update admin's own name, email, and phone number.
      summary: Update admin profile
      tags:
      - admin
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfile'
            examples:
              UpdateAdminProfile:
                value:
                  full_name: Admin Name
                  email: admin@example.com
                  phone_number: '+1234567890'
                summary: Update Admin Profile
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
  /api/v1/admin/residents/:
    get:
      operationId: admin_residents_list
      description: Retrieve paginated list of all resident users with community, last
        check-in, and profile photo.
      summary: List residents
      parameters:
      - in: query
        name: hub_id
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - admin
      - Residents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResidentList'
          description: ''
  /api/v1/admin/residents/{user_id}/:
    get:
      operationId: admin_residents_retrieve
      description: Full resident details including community, last check-in, check-in
        count, and profile photo.
      summary: Get resident details
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - admin
      - Residents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentDetail'
          description: ''
  /api/v1/admin/residents/{user_id}/activate/:
    patch:
      operationId: admin_residents_activate_partial_update
      description: Reactivate a suspended resident account.
      summary: Activate resident
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - admin
      - Residents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentList'
          description: ''
  /api/v1/admin/residents/{user_id}/suspend/:
    patch:
      operationId: admin_residents_suspend_partial_update
      description: Deactivate a resident account.
      summary: Suspend resident
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - admin
      - Residents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentList'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: Retrieve paginated list of all platform users for access control.
      summary: List all users
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - coordinator
          - government
          - resident
      - in: query
        name: search
        schema:
          type: string
      tags:
      - admin
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserList'
          description: ''
  /api/v1/admin/users/{user_id}/activate/:
    patch:
      operationId: admin_users_activate_partial_update
      description: Reactivate a suspended user account.
      summary: Activate any user
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - admin
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
          description: ''
  /api/v1/admin/users/{user_id}/role/:
    patch:
      operationId: admin_users_role_partial_update
      description: Change a user's role (e.g. resident to coordinator).
      summary: Set user role
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - admin
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetail'
          description: ''
  /api/v1/admin/users/{user_id}/suspend/:
    patch:
      operationId: admin_users_suspend_partial_update
      description: Deactivate any user account (resident, coordinator, government).
      summary: Suspend any user
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - admin
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSuspendUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSuspendUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSuspendUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
          description: ''
  /api/v1/admin/users/invite/:
    post:
      operationId: admin_users_invite_create
      description: Invite a new user (resident, coordinator, or government).
      summary: Invite user
      tags:
      - admin
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUser'
            examples:
              InviteUserExample:
                value:
                  phone_number: 01856669533
                  full_name: John Doe
                  role: resident
                  hub_id: 1
                summary: Invite User Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteUser'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/admin/users/invite-by-email/:
    post:
      operationId: admin_users_invite_by_email_create
      description: Send an invitation email to a government user.
      summary: Invite government user by email
      tags:
      - admin
      - dashboard
      - Users
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
  /api/v1/ai/control-config/:
    get:
      operationId: ai_control_config_retrieve
      description: 'GET: Retrieve the singleton message review configuration. PUT:
        Update fields (partial). Returns the full config.'
      summary: Get or update Message Review Config
      tags:
      - admin
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReviewConfig'
          description: ''
    put:
      operationId: ai_control_config_update
      description: 'GET: Retrieve the singleton message review configuration. PUT:
        Update fields (partial). Returns the full config.'
      summary: Get or update Message Review Config
      tags:
      - admin
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageReviewConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageReviewConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageReviewConfig'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReviewConfig'
          description: ''
  /api/v1/ai/message-review/:
    get:
      operationId: ai_message_review_list
      description: 'Paginated list of hazards and check-ins pending review. Filters:
        ?status=pending&severity=3&source=hazard'
      summary: List message review queue
      parameters:
      - in: query
        name: severity
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
      - in: query
        name: source
        schema:
          type: string
          enum:
          - checkin
          - hazard
      - in: query
        name: status
        schema:
          type: string
          enum:
          - escalated
          - pending
          - resolved
          - reviewed
      tags:
      - admin
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageReviewItem'
          description: ''
  /api/v1/ai/message-review/{source}/{item_id}/:
    get:
      operationId: ai_message_review_retrieve
      description: 'GET: return single item. PATCH: update review_status, sets reviewed_by
        and reviewed_at.'
      summary: Get or update a review item
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      - in: path
        name: source
        schema:
          type: string
        required: true
      tags:
      - admin
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReviewItem'
          description: ''
    patch:
      operationId: ai_message_review_partial_update
      description: 'GET: return single item. PATCH: update review_status, sets reviewed_by
        and reviewed_at.'
      summary: Get or update a review item
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      - in: path
        name: source
        schema:
          type: string
        required: true
      tags:
      - admin
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMessageReviewStatusUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMessageReviewStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMessageReviewStatusUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReviewItem'
          description: ''
  /api/v1/ai/reporting-config/:
    get:
      operationId: ai_reporting_config_retrieve
      description: 'GET: Retrieve the singleton AI reporting configuration. PUT: Update
        fields (partial). Returns the full config.'
      summary: Get or update AI Reporting Config
      tags:
      - admin
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportingConfig'
          description: ''
    put:
      operationId: ai_reporting_config_update
      description: 'GET: Retrieve the singleton AI reporting configuration. PUT: Update
        fields (partial). Returns the full config.'
      summary: Get or update AI Reporting Config
      tags:
      - admin
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReportingConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIReportingConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIReportingConfig'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportingConfig'
          description: ''
  /api/v1/ai/reports/:
    get:
      operationId: ai_reports_list
      description: 'GET: paginated list of reports. POST: manually trigger a new report.'
      summary: List or create situation reports
      tags:
      - admin
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
